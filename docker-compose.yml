name: pricehunt

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pricehunt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricehunt}
      POSTGRES_DB: ${POSTGRES_DB:-pricehunt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    image: pricehunt-api:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pricehunt}:${POSTGRES_PASSWORD:-pricehunt}@db:5432/${POSTGRES_DB:-pricehunt}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-Europe/Madrid}
      DEMO_MODE: ${DEMO_MODE:-false}
      REFRESH_ON_STARTUP: ${REFRESH_ON_STARTUP:-true}
      REFRESH_INTERVAL_HOURS: ${REFRESH_INTERVAL_HOURS:-24}
      REFRESH_CRON_HOUR: ${REFRESH_CRON_HOUR:-7}
      MIN_DISCOUNT_PCT: ${MIN_DISCOUNT_PCT:-5}
      SCRAPE_DELAY_SECONDS: ${SCRAPE_DELAY_SECONDS:-2}
      AMAZON_ACCESS_KEY: ${AMAZON_ACCESS_KEY:-}
      AMAZON_SECRET_KEY: ${AMAZON_SECRET_KEY:-}
      AMAZON_PARTNER_TAG: ${AMAZON_PARTNER_TAG:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build: ./frontend
    image: pricehunt-web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

  # --- herramientas opcionales: docker compose --profile tools up -d
  adminer:
    image: adminer:4
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8081:8080"
    depends_on: [db]

  # --- observabilidad: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pricehunt.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

volumes:
  pgdata:
  grafana:
