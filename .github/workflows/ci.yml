name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, migraciones y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pricehunt
          POSTGRES_PASSWORD: pricehunt
          POSTGRES_DB: pricehunt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pricehunt" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://pricehunt:pricehunt@localhost:5432/pricehunt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint + formato)
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: Migraciones (upgrade, downgrade, sin drift)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Tests contra Postgres
        run: pytest --cov=app --cov-report=xml --cov-report=term --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/coverage.xml
            backend/junit.xml

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  security:
    name: Seguridad · Trivy (deps + IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: E2E · docker compose (modo demo)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DEMO_MODE: "true"
      SCRAPE_DELAY_SECONDS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: docker compose build
      - name: Up (espera a healthchecks)
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        run: ./scripts/smoke.sh http://localhost:8080
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Down
        if: always()
        run: docker compose down -v
